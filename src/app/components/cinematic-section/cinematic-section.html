<section
  #escena
  id="experiencia"
  class="neo-cinematic relative isolate"
>
  <div
    data-iluminacion
    class="neo-ambient-light pointer-events-none absolute inset-0"
    aria-hidden="true"
  ></div>
  <div
    class="neo-cinematic-grid pointer-events-none absolute inset-0"
    aria-hidden="true"
  ></div>

  <div
    class="relative mx-auto flex min-h-[90svh] max-w-7xl flex-col
           items-center justify-center px-5 py-14 sm:px-8
           lg:min-h-[100svh] lg:py-8"
  >
    <p class="mb-8 text-center text-xs font-semibold uppercase tracking-[0.3em] text-violet-600 dark:text-violet-300">
      NeoArt Experience
    </p>

    <div class="neo-text-viewport w-full">
      <h2 class="neo-motion-title w-full text-center font-black uppercase">
        <span data-linea-uno class="block">NO ES SOLO</span>
        <span data-linea-dos class="neo-gradient-text block">UN CUADRO.</span>
      </h2>
    </div>

    <p
      data-descripcion
      class="mx-auto mt-6 max-w-xl text-center text-sm leading-7 text-zinc-600 dark:text-zinc-400 sm:text-base"
    >
      Creamos experiencias visuales que combinan resina epoxica,
      creatividad y luz neon.
    </p>

    <div
      class="relative mt-8 flex w-full max-w-5xl items-center
             justify-center sm:mt-8"
      (pointermove)="moverPoster($event)"
      (pointerleave)="restaurarPoster()"
    >
      <div data-marco class="neo-moving-frame relative flex items-center justify-center">
        <div
          #poster
          class="neo-interactive-poster relative"
          role="img"
          aria-label="Cuadro horizontal real NeoArt Tony Montana con fondo de billete"
        >
          <img class="neo-cinema-real-img"
               src="/images/cuadros/tony-montana-clasico.jpeg"
               alt="Fotografia original de cuadro NeoArt Tony Montana"
               loading="lazy" decoding="async" />
        </div>
      </div>
    </div>

    <p class="mt-8 text-center text-[10px] font-semibold uppercase tracking-[0.25em] text-zinc-500 dark:text-zinc-400">
      Desliza para descubrir
    </p>
  </div>
</section>
