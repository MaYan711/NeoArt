<section
  #escena
  id="experiencia"
  class="neo-cinematic relative isolate bg-[#08080e] text-white"
>
  <div
    data-iluminacion
    class="neo-ambient-light pointer-events-none absolute inset-0"
    aria-hidden="true"
  ></div>
  <div
    class="neo-cinematic-grid pointer-events-none absolute inset-0"
    aria-hidden="true"
  ></div>

  <div
    class="relative mx-auto flex min-h-[90svh] max-w-7xl flex-col
           items-center justify-center px-5 py-20 sm:px-8
           lg:min-h-[100svh] lg:py-12"
  >
    <p class="mb-8 text-center text-xs font-semibold uppercase tracking-[0.3em] text-violet-300">
      NeoArt Experience
    </p>

    <div class="neo-text-viewport w-full">
      <h2 class="neo-motion-title w-full text-center font-black uppercase">
        <span data-linea-uno class="block">NO ES SOLO</span>
        <span data-linea-dos class="neo-gradient-text block">UN CUADRO.</span>
      </h2>
    </div>

    <p
      data-descripcion
      class="mx-auto mt-6 max-w-xl text-center text-sm leading-7
             text-zinc-400 sm:text-base"
    >
      Creamos experiencias visuales que combinan resina epoxica,
      creatividad y luz neon.
    </p>

    <div
      class="relative mt-8 flex w-full max-w-xl items-center
             justify-center sm:mt-10"
      (pointermove)="moverPoster($event)"
      (pointerleave)="restaurarPoster()"
    >
      <div data-marco class="neo-moving-frame relative flex items-center justify-center">
        <div
          #poster
          class="neo-interactive-poster relative flex flex-col
                 justify-between p-6 sm:p-8"
          role="img"
          aria-label="Ilustracion de un cuadro NeoArt iluminado"
        >
          <p class="text-[10px] font-semibold uppercase tracking-[0.3em] text-violet-200">
            NEOART / 001
          </p>
          <div>
            <h3 class="neo-poster-title font-black">LIGHT<br>MEETS<br>ART.</h3>
            <div class="mt-5 h-[2px] w-24 bg-fuchsia-400 shadow-[0_0_20px_#e879f9]"></div>
          </div>
          <p class="text-[10px] uppercase tracking-[0.25em] text-violet-200">
            Epoxy / LED / Design
          </p>
        </div>
      </div>
    </div>

    <p class="mt-8 text-center text-[10px] font-semibold uppercase tracking-[0.25em] text-zinc-500">
      Desliza para descubrir
    </p>
  </div>
</section>
